plugins:
  enabled:
    - fishaudio-provider

tts:
  provider: fishaudio
  fishaudio:
    model: s2.1-pro-free
    reference_id: your_fish_reference_id
    format: mp3
    sample_rate: 44100
    mp3_bitrate: 128
    temperature: 0.7
    top_p: 0.7
    timeout: 120
    max_retries: 2
    # allow_insecure_local: false   # set true ONLY for a local HTTP proxy

    # Optional voice aliases and presets.
    voices:
      primary: your_fish_reference_id
    presets:
      primary:
        voice: primary
        model: s2.1-pro-free